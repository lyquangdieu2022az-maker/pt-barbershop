services:
  - type: web
    name: pt-barbershop-pos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PT_ADMIN_ID
        sync: false
      - key: PT_ADMIN_PASSWORD
        sync: false
      - key: PT_CASHIER_ID
        sync: false
      - key: PT_CASHIER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pt-barbershop-db
          property: connectionString

databases:
  - name: pt-barbershop-db
    databaseName: pt_barbershop
    user: pt_barbershop
    plan: free
